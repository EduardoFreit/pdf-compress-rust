[package]
name = "projeto-02"
version = "0.1.0"
edition = "2024"
description = "Otimizador de imagens e PDFs em Rust, compilado para WebAssembly"
repository = "https://github.com/EduardoFreit/pdf-compress-rust"

[dependencies]
image = "0.25.5"
lopdf = "=0.35.0"
miniz_oxide = "0.8"
ttf-parser = "0.25"
wasm-bindgen = "0.2.100"
zopfli = { version = "0.8", default-features = false, features = ["std", "zlib"] }

# Em alvos nativos (testes, CLI) as imagens do PDF são processadas em paralelo.
# No navegador (wasm32-unknown-unknown) não há threads, então o processamento é
# sequencial e roda dentro de um Web Worker para não travar a interface.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
