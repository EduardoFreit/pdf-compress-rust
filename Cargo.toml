[package]
name = "projeto-02"
version = "0.1.0"
edition = "2024"

[dependencies]
image = "0.25.5"
lopdf = "=0.35.0"
wasm-bindgen = "0.2.100"

# Em alvos nativos (testes, CLI) as imagens do PDF são processadas em paralelo.
# No navegador (wasm32-unknown-unknown) não há threads, então o processamento é
# sequencial e roda dentro de um Web Worker para não travar a interface.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
